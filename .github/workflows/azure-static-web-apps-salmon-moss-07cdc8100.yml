name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # PRのときはビルド検証のみ（Azure にステージング環境を作らない）
  validate_pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Validate PR Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: true

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            api/package-lock.json

      - name: Build Frontend
        working-directory: ./app
        env:
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}
        run: |
          npm install
          npm run build

      - name: Install API dependencies
        working-directory: ./api
        run: npm install

  # main へのプッシュで本番デプロイ。
  # TEMP: このPR(#11)の動作確認のため、一時的にPRでもプレビュー環境へのデプロイを復活させている。
  # 確認完了後は `github.event_name == 'push' && github.ref == 'refs/heads/main'` に戻すこと。
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: true

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            api/package-lock.json

      - name: Build Frontend
        working-directory: ./app
        env:
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}
        run: |
          npm install
          npm run build

      - name: Install API dependencies
        working-directory: ./api
        run: npm install

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MOSS_07CDC8100 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "app/dist"
          api_location: "api"
          skip_app_build: true
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MOSS_07CDC8100 }}
          action: "close"
